[project]
name = "food-map-journal-backend"
version = "0.1.0"
description = "Backend for food-map-journal — a flexible map collection platform"
requires-python = ">=3.10"
dependencies = [
    "django>=5.1,<5.2",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "django-cors-headers>=4.4",
    "django-filter>=24.3",
    "dj-database-url>=2.2",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "Pillow>=10.4",
    "google-auth>=2.35",
    "requests>=2.32",
    "channels>=4.1",
    "channels-redis>=4.2",
    "daphne>=4.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
